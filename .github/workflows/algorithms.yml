name: algorithms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algorithms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: quality-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy
      - name: Test with coverage
        run: pytest

  data-workflow:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Run canonical LAC and t-SNE workflow
        run: dela-sne-run
      - name: Upload algorithm results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: algorithm-results
          path: data/result/*.csv

  paper:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies and package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Verify bibliography synchronization
        run: python scripts/sync_bibliography.py --check
      - name: Preserve committed numerical baselines
        run: cp -R paper/experiments/assets /tmp/paper-assets-baseline
      - name: Run paper experiments
        run: python paper/experiments/run_experiments.py
      - name: Compare numerical assets with tolerance
        run: >-
          python scripts/compare_csv_assets.py
          /tmp/paper-assets-baseline paper/experiments/assets
          --rtol 1e-8 --atol 1e-10
      - name: Verify generated figures
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            paper/figures/annealing_bifurcation.pdf
            paper/figures/lac_multiseed_validation.pdf
            paper/figures/sne_density_scaling.pdf
            paper/figures/sne_neighbor_response.pdf
            paper/figures/lac_schottky_validation.pdf
            paper/figures/lac_selector_baselines.pdf
            paper/figures/lac_stress_tests.pdf
            paper/figures/sne_perplexity_validation.pdf
            paper/experiments/assets/source_images/annealing_bifurcation.png
            paper/experiments/assets/source_images/lac_multiseed_validation.png
            paper/experiments/assets/source_images/sne_density_scaling.png
            paper/experiments/assets/source_images/sne_neighbor_response.png
            paper/experiments/assets/source_images/lac_schottky_validation.png
            paper/experiments/assets/source_images/lac_selector_baselines.png
            paper/experiments/assets/source_images/lac_stress_tests.png
            paper/experiments/assets/source_images/sne_perplexity_validation.png
          )
          for file in "${expected[@]}"; do
            test -s "$file" || { echo "Missing or empty paper asset: $file"; exit 1; }
          done
      - name: Compile manuscript
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: paper
      - name: Verify manuscript PDF
        run: test -s paper/main.pdf
      - name: Upload paper experiment assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paper-experiment-assets
          path: |
            paper/figures/*.pdf
            paper/experiments/assets/*.csv
            paper/experiments/assets/source_images/*.png
      - name: Upload compiled manuscript
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: manuscript
          path: paper/main.pdf

  materialize-editorial-hotfix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-sne-tolerance-section' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/fix-sne-tolerance-section
          fetch-depth: 0
      - name: Apply editorial hotfix
        run: python paper/_apply_editorial_hotfix.py
      - name: Compile hotfixed manuscript
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: paper
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.tex
          git commit -m "Fix SNE tolerance section and conclusion" || exit 0
          git push origin HEAD:agent/fix-sne-tolerance-section
