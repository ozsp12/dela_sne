name: algorithms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run joint LAC and t-SNE workflow
        run: python run_workflow.py

      - name: Upload result datasets
        uses: actions/upload-artifact@v4
        with:
          name: algorithm-results
          path: data/result/*.csv
