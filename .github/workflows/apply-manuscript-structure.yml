name: apply-manuscript-structure

on:
  push:
    branches: [agent/glossary-disclosures]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/glossary-disclosures
          fetch-depth: 0

      - name: Apply manuscript edits
        run: python paper/apply_requested_structure.py

      - name: Commit manuscript edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.tex paper/apply_requested_structure.py
          git commit -m "Add glossary and manuscript disclosures"
          git push origin HEAD:agent/glossary-disclosures
