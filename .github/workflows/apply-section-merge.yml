name: apply-section-merge

on:
  push:
    branches: [agent/merge-sections-7-8]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/merge-sections-7-8
          fetch-depth: 0

      - name: Apply manuscript edits
        run: python scripts/apply_section_merge.py

      - name: Commit manuscript edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.tex scripts/apply_section_merge.py
          git commit -m "Merge feature-neighbor sections and page-break glossary"
          git push origin HEAD:agent/merge-sections-7-8
