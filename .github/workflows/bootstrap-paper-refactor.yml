name: bootstrap-paper-refactor

on:
  push:
    branches: [agent/self-contained-paper-refactor]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/self-contained-paper-refactor
          fetch-depth: 0

      - name: Unpack final paper tree
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('.bootstrap/paper_refactor.zip') as archive:
              archive.extractall('.')
          PY
          rm -rf paper_experiment

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install paper dependencies
        run: python -m pip install -r paper/experiments/requirements.txt

      - name: Validate and run paper experiments
        run: |
          python -m py_compile paper/experiments/run_experiments.py
          python paper/experiments/run_experiments.py

      - name: Commit final refactor and remove bootstrap files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch paper_experiment
          git rm -r --ignore-unmatch .bootstrap/paper_refactor.zip
          git rm --ignore-unmatch .github/workflows/bootstrap-paper-refactor.yml
          git add README.md .github/workflows/algorithms.yml paper
          git add -A
          git commit -m "Make paper workflow self-contained"
          git push origin "HEAD:${GITHUB_REF_NAME}"
