name: bootstrap-paper-refactor

on:
  push:
    branches: [agent/self-contained-paper-refactor]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/self-contained-paper-refactor
          fetch-depth: 0

      - name: Reconstruct and verify final paper tree
        run: |
          echo "ad00fb6185a15171af2bccdf53a950d09df59cdc3da9d60e9613fc023d1d04d3  .bootstrap/chunk_01.b64" | sha256sum -c -
          echo "2e06252df3cca70adac56f84b7f96b027445a2890ffe07f2eaddbb631ed728d7  .bootstrap/chunk_02a.b64" | sha256sum -c -
          echo "4df4af39be5f2b77df32f6b8b08d6ca472acc1b3a611abb25977c96e776b255c  .bootstrap/chunk_02b.b64" | sha256sum -c -
          echo "34fea65aee00c3aa0705b8ed98996a143b943433f29a5c79dce1669af26106c4  .bootstrap/chunk_03.b64" | sha256sum -c -
          echo "41ea0c0792b24818cce9a760ed36c6146f8df7e6714ff0e87016b883b8418a23  .bootstrap/chunk_04.b64" | sha256sum -c -
          echo "27dda76016b33983b6637d2ebb78b88d8b5279c795de4392a2e337e376210c71  .bootstrap/chunk_05.b64" | sha256sum -c -
          cat .bootstrap/chunk_01.b64 .bootstrap/chunk_02a.b64 .bootstrap/chunk_02b.b64 .bootstrap/chunk_03.b64 .bootstrap/chunk_04.b64 .bootstrap/chunk_05.b64 | base64 -d > /tmp/paper_refactor.zip
          echo "298fc6171dcf473a5019c2e13d74291668b22d7e2336dee7a081546a4857dd16  /tmp/paper_refactor.zip" | sha256sum -c -
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/paper_refactor.zip') as archive:
              archive.extractall('.')
          PY
          rm -rf paper_experiment
          git checkout -- .github/workflows/algorithms.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install paper dependencies
        run: python -m pip install -r paper/experiments/requirements.txt

      - name: Validate and run paper experiments
        run: |
          python -m py_compile paper/experiments/run_experiments.py
          python paper/experiments/run_experiments.py
          rm -rf paper/experiments/__pycache__

      - name: Commit materialized paper tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch paper_experiment
          git rm -r --ignore-unmatch .bootstrap
          git add README.md paper
          git commit -m "Make paper workflow self-contained"
          git push origin "HEAD:agent/self-contained-paper-refactor"
