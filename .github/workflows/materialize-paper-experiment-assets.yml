name: materialize-paper-experiment-assets

on:
  push:
    branches:
      - agent/reorganize-paper-experiment

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reorganize-paper-experiment
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install experiment dependencies
        run: python -m pip install -r paper_experiment/requirements.txt
      - name: Point workflow outputs to assets
        run: |
          sed -i 's#experiments/statistical_mechanics/outputs#paper_experiment/assets#g' paper_experiment/run_experiments.py
          sed -i 's#parent / "outputs"#parent / "assets"#g' paper_experiment/run_experiments.py
      - name: Run paper experiments
        run: python paper_experiment/run_experiments.py
      - name: Commit versioned assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper_experiment/run_experiments.py paper_experiment/assets
          git commit -m 'Add paper experiment assets'
          git push origin HEAD:agent/reorganize-paper-experiment
