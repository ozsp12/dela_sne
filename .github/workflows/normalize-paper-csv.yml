name: normalize-paper-csv

on:
  push:
    branches: [agent/self-contained-paper-refactor]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/self-contained-paper-refactor
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch deterministic CSV serialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('paper/experiments/run_experiments.py')
          s = p.read_text()
          needle = 'MAX_ITER = 100\n'
          insert = '''MAX_ITER = 100\n\n\ndef csv_value(value):\n    \"\"\"Return a deterministic, platform-stable representation for CSV output.\"\"\"\n    if isinstance(value, (float, np.floating)):\n        value = float(value)\n        if np.isnan(value):\n            return \"nan\"\n        if np.isposinf(value):\n            return \"inf\"\n        if np.isneginf(value):\n            return \"-inf\"\n        return f\"{value:.12g}\"\n    return value\n'''
          if 'def csv_value(value):' not in s:
              s = s.replace(needle, insert)
          s = s.replace('wr.writerow({k: r[k] for k in fields})', 'wr.writerow({k: csv_value(r[k]) for k in fields})')
          s = s.replace('wr.writerow({k: r[k] for k in conv_fields})', 'wr.writerow({k: csv_value(r[k]) for k in conv_fields})')
          s = s.replace('wr.writeheader(); wr.writerows(rows)', 'wr.writeheader(); wr.writerows({k: csv_value(v) for k, v in r.items()} for r in rows)')
          p.write_text(s)
          PY

      - name: Install dependencies and regenerate assets
        run: |
          python -m pip install -r paper/experiments/requirements.txt
          python -m py_compile paper/experiments/run_experiments.py
          python paper/experiments/run_experiments.py
          rm -rf paper/experiments/__pycache__

      - name: Commit deterministic driver and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/experiments/run_experiments.py paper/experiments/assets paper/figures
          git commit -m "Make paper experiment assets deterministic"
          git push origin "HEAD:agent/self-contained-paper-refactor"
