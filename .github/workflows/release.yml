name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies and package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Verify bibliography synchronization
        run: python scripts/sync_bibliography.py --check

      - name: Reproduce paper assets
        run: python paper/experiments/run_experiments.py

      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper

      - name: Create GitHub release and upload manuscript
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" paper/main.pdf --clobber
