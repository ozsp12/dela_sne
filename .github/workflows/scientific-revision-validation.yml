name: scientific-revision-validation

on:
  push:
    branches: [agent/scientific-revision-schottky]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scientific-revision-materialization
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/scientific-revision-schottky
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Refine scientific revision sources
        run: python paper/experiments/_patch_scientific_revision_sources.py
      - name: Regenerate corrected Schottky diagnostic
        working-directory: paper/experiments
        run: python -c "import revision_experiments as r; r.schottky_validation()"
      - name: Patch transient revision helper
        run: python scripts/fix_scientific_revision_helper.py
      - name: Apply scientific manuscript revision
        run: python scripts/apply_scientific_revision.py
      - name: Verify synchronized bibliography
        run: python scripts/sync_bibliography.py --check
      - name: Compile revised manuscript
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          root_file: main.tex
          working_directory: paper
      - name: Commit generated scientific revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.tex paper/references.bib references/references.bib \
            paper/experiments/revision_experiments.py \
            paper/experiments/README.md paper/experiments/MANIFEST.txt \
            paper/experiments/assets/lac_schottky_diagnostics.csv \
            paper/experiments/assets/source_images/lac_schottky_validation.png \
            paper/figures/lac_schottky_validation.pdf
          git commit -m "Refine empirical Schottky response analysis" || exit 0
          git push origin HEAD:agent/scientific-revision-schottky
      - name: Upload revised manuscript
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: revised-manuscript
          path: paper/main.pdf
