name: scientific-revision-validation

on:
  push:
    branches: [agent/scientific-revision-schottky]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Run full paper experiment suite
        run: python paper/experiments/run_experiments.py
      - name: Upload revision CSVs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scientific-revision-csv
          path: |
            paper/experiments/assets/lac_schottky_diagnostics.csv
            paper/experiments/assets/lac_unsupervised_baselines.csv
            paper/experiments/assets/lac_stress_tests.csv
            paper/experiments/assets/sne_perplexity_validation.csv
      - name: Upload revision figures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scientific-revision-figures
          path: |
            paper/figures/lac_schottky_validation.pdf
            paper/figures/lac_selector_baselines.pdf
            paper/figures/lac_stress_tests.pdf
            paper/figures/sne_perplexity_validation.pdf
            paper/experiments/assets/source_images/lac_schottky_validation.png
            paper/experiments/assets/source_images/lac_selector_baselines.png
            paper/experiments/assets/source_images/lac_stress_tests.png
            paper/experiments/assets/source_images/sne_perplexity_validation.png
